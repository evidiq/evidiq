<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Redact deterministic sensitive data detection and removal</title>
  <desc id="desc">Checksum-validated detection and removal of PII, credentials, and keys from text, documents, and datasets, with a signed report and zero retention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#0c2e2b"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#0f766e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- Document being filtered: readable lines on the left, redacted on the right -->
  <g transform="translate(150 170)">
    <rect x="0" y="0" width="330" height="410" rx="18" fill="#0f172a" fill-opacity=".72" stroke="#334155" stroke-width="2"/>
    <g fill="#94a3b8">
      <rect x="34" y="46" width="220" height="12" rx="6"/>
      <rect x="34" y="86" width="262" height="12" rx="6"/>
      <rect x="34" y="126" width="180" height="12" rx="6"/>
      <rect x="34" y="206" width="244" height="12" rx="6"/>
      <rect x="34" y="286" width="200" height="12" rx="6"/>
      <rect x="34" y="326" width="256" height="12" rx="6"/>
    </g>
    <g fill="#f87171">
      <rect x="34" y="166" width="150" height="12" rx="6"/>
      <rect x="34" y="246" width="196" height="12" rx="6"/>
    </g>
  </g>

  <!-- Deterministic engine -->
  <g transform="translate(520 300)">
    <rect x="0" y="0" width="160" height="150" rx="20" fill="#0f172a" fill-opacity=".85" stroke="url(#line)" stroke-width="3"/>
    <g stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M36 46 L124 46"/>
      <path d="M48 75 L112 75"/>
      <path d="M62 104 L98 104"/>
    </g>
  </g>
  <g stroke="url(#line)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M480 375 L512 375"/>
    <path d="M688 375 L720 375"/>
  </g>

  <!-- Redacted output -->
  <g transform="translate(720 170)">
    <rect x="0" y="0" width="330" height="410" rx="18" fill="#0f172a" fill-opacity=".72" stroke="#0d9488" stroke-width="2"/>
    <g fill="#94a3b8">
      <rect x="34" y="46" width="220" height="12" rx="6"/>
      <rect x="34" y="86" width="262" height="12" rx="6"/>
      <rect x="34" y="126" width="180" height="12" rx="6"/>
      <rect x="34" y="206" width="244" height="12" rx="6"/>
      <rect x="34" y="286" width="200" height="12" rx="6"/>
      <rect x="34" y="326" width="256" height="12" rx="6"/>
    </g>
    <g fill="#134e4a" stroke="#2dd4bf" stroke-width="2">
      <rect x="34" y="164" width="150" height="16" rx="8"/>
      <rect x="34" y="244" width="196" height="16" rx="8"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" text-anchor="middle">
    <text x="600" y="108" fill="#f8fafc" font-size="60" font-weight="800" letter-spacing="-1">EVIDIQ Redact</text>
    <text x="600" y="158" fill="#99f6e4" font-size="27" font-weight="600">Detect · Classify · Redact · Prove</text>
    <text x="600" y="648" fill="#cbd5e1" font-size="24">Checksum-validated detection · signed report · zero retention</text>
    <text x="600" y="692" fill="#5eead4" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mcp.evidiq.dev/redact/mcp</text>
  </g>
</svg>
