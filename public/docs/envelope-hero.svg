<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Envelope — Inbound Message Authenticity</title>
  <desc id="desc">Cryptographic verification of inbound messages: SPF, DKIM, DMARC and ARC on the raw message, sender-spoofing detection, header-chain forensics, and structural risk of attachments and links — with the DNS answers pinned into a signed report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="40" fill="url(#glow)"/>

  <!-- Envelope crease lines background -->
  <g opacity=".15" stroke="#7dd3fc" fill="none" stroke-width="1.5">
    <path d="M0 130H280M0 210H220M0 290H340M0 570H260M0 650H300"/>
    <path d="M1200 130H920M1200 210H980M1200 290H860M1200 570H940M1200 650H900"/>
  </g>

  <g opacity=".12">
    <rect x="160" y="310" width="880" height="3" fill="url(#seal)"/>
  </g>

  <g transform="translate(600 355)">
    <circle r="234" fill="#0e7490" opacity=".2" filter="url(#soft)"/>
    <circle r="198" fill="none" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 14"/>

    <!-- Envelope -->
    <g transform="translate(-155 -115)">
      <rect x="0" y="0" width="310" height="200" rx="18" fill="#0f172a" stroke="url(#env)" stroke-width="3"/>
      <path d="M0 14 C60 78 250 78 310 14" fill="none" stroke="#6366f1" stroke-width="3" opacity=".9"/>
      <path d="M0 0 L155 118 L310 0" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      <circle cx="155" cy="100" r="7" fill="#2dd4bf"/>
      <!-- Badge on the flap -->
      <circle cx="155" cy="58" r="30" fill="none" stroke="#34d399" stroke-width="2.5" opacity=".9"/>
      <path d="M155 44 L155 70 M155 44 L138 58 M155 44 L172 58" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Signature curve -->
    <path d="M-30 320 C 20 285, 60 340, 110 305 S 200 290, 250 318" fill="none" stroke="url(#seal)" stroke-width="5" stroke-linecap="round" opacity=".95"/>
    <circle cx="262" cy="318" r="6" fill="#2dd4bf"/>
  </g>

  <!-- Status chips -->
  <g transform="translate(72 610)">
    <rect width="350" height="77" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".38"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7dd3fc">VERDICT</text>
    <text x="22" y="59" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#f0f9ff">not-authenticated · no sig</text>
  </g>

  <g transform="translate(852 586)">
    <rect width="276" height="101" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="22" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2dd4bf">REPORT</text>
    <text x="22" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">SPF · DKIM · DMARC · ARC</text>
    <text x="22" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">EIP-191 · pinned DNS · 0G</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff">
    <text x="76" y="96" font-size="25" font-weight="700" letter-spacing="7" fill="#7dd3fc">EVIDIQ ENVELOPE</text>
    <text x="76" y="145" font-size="27" fill="#e0f2fe">Inbound Message Authenticity</text>
  </g>
</svg>
