<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Bulwark — Prompt Injection &amp; LLM Input Safety Guard</title>
  <desc id="desc">Deterministic prompt injection, jailbreak, data exfiltration, and system-prompt leak detection for autonomous AI agents with EIP-191 signed attestations and 0G storage anchoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#134e4a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#0891b2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="40" fill="url(#glow)"/>

  <!-- Pattern scan lines background -->
  <g opacity=".12" stroke="#5eead4" fill="none" stroke-width="1.5">
    <path d="M0 120H300M0 200H240M0 280H360M0 580H280M0 660H320"/>
    <path d="M1200 120H900M1200 200H960M1200 280H840M1200 580H920M1200 660H880"/>
  </g>

  <!-- Scanning beam effect -->
  <g opacity=".15">
    <rect x="180" y="300" width="840" height="3" fill="url(#scan)"/>
    <rect x="180" y="310" width="840" height="1" fill="#34d399"/>
  </g>

  <g transform="translate(600 365)">
    <circle r="234" fill="#0d9488" opacity=".15" filter="url(#soft)"/>
    <circle r="198" fill="none" stroke="#2dd4bf" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 14"/>
    <circle r="162" fill="#0f172a" stroke="#14b8a6" stroke-width="2"/>

    <!-- Shield icon with checkmark -->
    <path d="M0 -90 L70 -60 L70 10 C70 50 40 75 0 90 C-40 75 -70 50 -70 10 L-70 -60 Z"
          fill="url(#shield)" opacity=".9" stroke="#5eead4" stroke-width="2"/>
    <!-- Checkmark inside shield -->
    <path d="M-28 5 L-8 28 L30 -20" fill="none" stroke="#f0fdfa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Detection nodes around shield -->
    <circle cx="-110" cy="-70" r="8" fill="#f87171" opacity=".8"/>
    <circle cx="100" cy="-80" r="8" fill="#fbbf24" opacity=".8"/>
    <circle cx="120" cy="40" r="8" fill="#f87171" opacity=".8"/>
    <circle cx="-100" cy="60" r="8" fill="#fbbf24" opacity=".8"/>
    <!-- Connection lines from nodes to shield (blocked) -->
    <line x1="-110" y1="-70" x2="-60" y2="-40" stroke="#f87171" stroke-width="2" stroke-dasharray="3 5" opacity=".5"/>
    <line x1="100" y1="-80" x2="55" y2="-50" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 5" opacity=".5"/>
    <line x1="120" y1="40" x2="65" y2="20" stroke="#f87171" stroke-width="2" stroke-dasharray="3 5" opacity=".5"/>
    <line x1="-100" y1="60" x2="-55" y2="35" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 5" opacity=".5"/>
    <!-- X marks on blocked threats -->
    <text x="-118" y="-86" font-family="ui-monospace,monospace" font-size="14" fill="#fca5a5" opacity=".7">×</text>
    <text x="108" y="-94" font-family="ui-monospace,monospace" font-size="14" fill="#fcd34d" opacity=".7">×</text>
    <text x="128" y="34" font-family="ui-monospace,monospace" font-size="14" fill="#fca5a5" opacity=".7">×</text>
    <text x="-108" y="68" font-family="ui-monospace,monospace" font-size="14" fill="#fcd34d" opacity=".7">×</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff">
    <text x="76" y="96" font-size="25" font-weight="700" letter-spacing="7" fill="#5eead4">EVIDIQ BULWARK</text>
    <text x="76" y="145" font-size="27" fill="#ccfbf1">Prompt Injection &amp; LLM Input Safety Guard</text>
  </g>

  <g transform="translate(72 610)">
    <rect width="340" height="77" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#5eead4" stroke-opacity=".38"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5eead4">VERDICT PRECEDENCE</text>
    <text x="22" y="59" font-family="ui-monospace, monospace" font-size="23" font-weight="700" fill="#f0fdfa">BLOCK &gt; WARN &gt; ALLOW</text>
  </g>

  <g transform="translate(852 586)">
    <rect width="276" height="101" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="22" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2dd4bf">ATTESTATION</text>
    <text x="22" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0fdfa">EIP-191 · RFC 8785 (JCS)</text>
    <text x="22" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0fdfa">0G Merkle Root Storage</text>
  </g>
</svg>
