<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Signet — Structured Design Artefacts</title>
  <desc id="desc">Brand and design artefacts issued as structured data — logo SVG, colour palette, type system, design tokens — each reproducible from its inputs and sealed with a signed, 0G-anchored receipt. No model anywhere; deterministic by construction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="40" fill="url(#glow)"/>

  <!-- token grid background -->
  <g opacity=".15" stroke="#7dd3fc" fill="none" stroke-width="1.5">
    <path d="M0 130H280M0 210H220M0 290H340M0 570H260M0 650H300"/>
    <path d="M1200 130H920M1200 210H980M1200 290H860M1200 570H940M1200 650H900"/>
    <path d="M0 200H1200M0 320H1200M0 440H1200M0 560H1200" stroke-opacity=".5"/>
  </g>

  <!-- Signet seal + palette swatches -->
  <g transform="translate(600 340)">
    <circle r="234" fill="#0e7490" opacity=".2" filter="url(#soft)"/>
    <circle r="198" fill="none" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 14"/>

    <!-- palette swatches (the computed deliverable) -->
    <g transform="translate(-185 -150)">
      <rect x="0" y="0" width="80" height="110" rx="12" fill="#22AAC3"/>
      <rect x="88" y="0" width="80" height="110" rx="12" fill="#2563EB"/>
      <rect x="176" y="0" width="80" height="110" rx="12" fill="#2BD4C3"/>
      <rect x="264" y="0" width="80" height="110" rx="12" fill="#F8FAFC"/>
      <rect x="352" y="0" width="80" height="110" rx="12" fill="#0F172A"/>
      <text x="0" y="140" font-family="ui-monospace, monospace" font-size="15" fill="#7f8aac">#22AAC3 · split-complementary · seed 06aedd…</text>
    </g>

    <!-- signet seal = two interlocked rings -->
    <g transform="translate(0 40)">
      <circle cx="-24" cy="0" r="54" fill="none" stroke="url(#seal)" stroke-width="9"/>
      <circle cx="24" cy="0" r="54" fill="none" stroke="url(#stripe)" stroke-width="9"/>
      <circle cx="-24" cy="0" r="10" fill="#2dd4bf"/>
      <circle cx="24" cy="0" r="10" fill="#4f46e5"/>
    </g>
  </g>

  <!-- chips -->
  <g transform="translate(72 610)">
    <rect width="360" height="77" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".38"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7dd3fc">DETERMINISM</text>
    <text x="22" y="59" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#f0f9ff">same seed → same bytes, 2 procs</text>
  </g>

  <g transform="translate(852 586)">
    <rect width="276" height="101" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="22" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2dd4bf">RECEIPT</text>
    <text x="22" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">JCS · EIP-191 · whole kit</text>
    <text x="22" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">on 0G · revision-chained</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff">
    <text x="76" y="96" font-size="25" font-weight="700" letter-spacing="7" fill="#7dd3fc">EVIDIQ SIGNET</text>
    <text x="76" y="145" font-size="27" fill="#e0f2fe">Structured Design Artefacts</text>
  </g>
</svg>
