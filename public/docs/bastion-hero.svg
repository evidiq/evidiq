<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Bastion deterministic infrastructure configuration auditor</title>
  <desc id="desc">Evaluates Dockerfiles, GitHub Actions workflows, Kubernetes manifests, and IaC against non-root execution, secret protection, supply chain integrity, and resource bounds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#0369a1" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="40" fill="url(#glow)"/>

  <!-- circuit lines -->
  <g opacity=".2" stroke="#bae6fd" fill="none">
    <path d="M0 190H210L290 265H480"/><path d="M0 300H230L300 320H480"/>
    <path d="M0 500H222L300 430H480"/>
    <path d="M1200 345H980L900 365H720"/>
    <circle cx="210" cy="190" r="7" fill="#bae6fd"/><circle cx="230" cy="300" r="7" fill="#bae6fd"/>
    <circle cx="222" cy="500" r="7" fill="#bae6fd"/><circle cx="980" cy="345" r="7" fill="#bae6fd"/>
  </g>

  <g transform="translate(600 365)">
    <circle r="234" fill="#0284c7" opacity=".15" filter="url(#soft)"/>
    <circle r="198" fill="none" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 14"/>
    <circle r="162" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <!-- Bastion Shield Icon -->
    <path d="M0 -90 L75 -45 V25 C75 75 0 105 0 105 C0 105 -75 75 -75 25 V-45 Z" fill="none" stroke="url(#mark)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-30 -10 L0 -40 L30 -10 M0 -40 V45" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff">
    <text x="76" y="96" font-size="25" font-weight="700" letter-spacing="7" fill="#bae6fd">EVIDIQ BASTION</text>
    <text x="76" y="145" font-size="27" fill="#e0f2fe">Is this deployment configuration safe to apply?</text>
  </g>

  <g transform="translate(72 610)">
    <rect width="300" height="77" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#bae6fd" stroke-opacity=".38"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#bae6fd">VERDICT</text>
    <text x="22" y="59" font-family="ui-monospace, monospace" font-size="19" font-weight="700" fill="#e0f2fe">PASS / REVIEW / BLOCK</text>
  </g>

  <g transform="translate(828 586)">
    <rect width="300" height="101" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="22" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#38bdf8">AUDIT TARGETS</text>
    <text x="22" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#e0f2fe">Dockerfile · Workflows</text>
    <text x="22" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#e0f2fe">K8s Manifests · HCL IaC</text>
  </g>
</svg>
