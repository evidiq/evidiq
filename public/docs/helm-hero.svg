<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Helm — Rule-Bound Execution</title>
  <desc id="desc">Rule-bound execution for the OKX.AI Trading Hackathon: a declarative trading mandate enforced by a deterministic engine, every decision EIP-191 signed and 0G-anchored before the fill, records chained by sequence number and predecessor hash.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="chain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="40" fill="url(#glow)"/>

  <!-- Chart grid background -->
  <g opacity=".15" stroke="#7dd3fc" fill="none" stroke-width="1.5">
    <path d="M0 130H280M0 210H220M0 290H340M0 570H260M0 650H300"/>
    <path d="M1200 130H920M1200 210H980M1200 290H860M1200 570H940M1200 650H900"/>
    <path d="M0 200H1200M0 320H1200M0 440H1200M0 560H1200" stroke-opacity=".5"/>
  </g>

  <!-- The ship's wheel / helm -->
  <g transform="translate(600 340)">
    <circle r="234" fill="#0e7490" opacity=".2" filter="url(#soft)"/>
    <circle r="198" fill="none" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 14"/>

    <!-- Helm wheel -->
    <g transform="rotate(-12)">
      <circle r="150" fill="none" stroke="url(#helm)" stroke-width="10"/>
      <g stroke="#a5b4fc" stroke-width="9" stroke-linecap="round" opacity=".9">
        <path d="M0 -150 L0 -105"/>
        <path d="M0 150 L0 105"/>
        <path d="M-150 0 L-105 0"/>
        <path d="M150 0 L105 0"/>
        <path d="M-106 -106 L-74 -74"/>
        <path d="M106 -106 L74 -74"/>
        <path d="M-106 106 L-74 74"/>
        <path d="M106 106 L74 74"/>
      </g>
      <circle r="105" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
      <circle r="52" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-opacity=".5"/>
      <circle r="16" fill="#f0f9ff"/>
      <circle r="7" fill="#4f46e5"/>
      <!-- chain links around the hub -->
      <g fill="none" stroke="#2dd4bf" stroke-width="3" opacity=".85">
        <path d="M-40 -40 h24 v14 h-24 z"/>
        <path d="M16 -40 h24 v14 h-24 z"/>
        <path d="M-40 26 h24 v14 h-24 z"/>
        <path d="M16 26 h24 v14 h-24 z"/>
      </g>
    </g>

    <!-- Signed decision line under the wheel -->
    <path d="M-120 230 C -60 205, -10 235, 50 215 S 150 225, 190 235" fill="none" stroke="url(#chain)" stroke-width="5" stroke-linecap="round" opacity=".95"/>
    <circle cx="205" cy="236" r="6" fill="#2dd4bf"/>
  </g>

  <!-- Status chips -->
  <g transform="translate(72 610)">
    <rect width="360" height="77" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".38"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7dd3fc">MANDATE</text>
    <text x="22" y="59" font-family="ui-monospace, monospace" font-size="21" font-weight="700" fill="#f0f9ff">risk 1% · stop 3% · daily 3%</text>
  </g>

  <g transform="translate(852 586)">
    <rect width="276" height="101" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="22" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2dd4bf">AUDIT</text>
    <text x="22" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">seq + prevHash + EIP-191</text>
    <text x="22" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">anchored BEFORE the fill · 0G</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff">
    <text x="76" y="96" font-size="25" font-weight="700" letter-spacing="7" fill="#7dd3fc">EVIDIQ HELM</text>
    <text x="76" y="145" font-size="27" fill="#e0f2fe">Rule-Bound Execution</text>
  </g>
</svg>
