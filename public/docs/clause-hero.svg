<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Clause — Decode Documents, Prove Statements</title>
  <desc id="desc">Plain-language decoding of agreements and policy documents — every statement quoted and checked against your document, reasoning inside TEE-attested 0G Compute enclaves, every report EIP-191 signed and 0G-anchored.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="40" fill="url(#glow)"/>

  <!-- ruled-paper grid background -->
  <g opacity=".14" stroke="#7dd3fc" fill="none" stroke-width="1.5">
    <path d="M0 130H280M0 210H220M0 290H340M0 570H260M0 650H300"/>
    <path d="M1200 130H920M1200 210H980M1200 290H860M1200 570H940M1200 650H900"/>
    <path d="M0 200H1200M0 320H1200M0 440H1200M0 560H1200" stroke-opacity=".5"/>
  </g>

  <!-- the document: clauses with a highlighted cited span -->
  <g transform="translate(190 120)">
    <rect x="0" y="0" width="520" height="560" rx="18" fill="#0b1220" stroke="#38bdf8" stroke-opacity=".28" stroke-width="2"/>
    <!-- clause lines -->
    <g font-family="ui-monospace, monospace" font-size="19" fill="#64748b">
      <rect x="24" y="26" width="150" height="12" rx="6" fill="#334155"/>
      <rect x="186" y="26" width="90" height="12" rx="6" fill="#334155"/>
      <text x="24" y="80" font-size="17">1. TERM. This agreement runs</text>
      <text x="24" y="108">for twelve (12) months.</text>
      <text x="24" y="152" font-size="17">2. RENT. payable monthly, in</text>
      <text x="24" y="180">advance, on the first day.</text>
      <text x="24" y="224" font-size="17">3. TERMINATION. Either party</text>
      <text x="24" y="252">may terminate by giving</text>
      <text x="24" y="280">not less than sixty (60) days</text>
      <text x="24" y="308">written notice.</text>
    </g>
    <!-- the cited span highlight -->
    <rect x="24" y="260" width="290" height="30" rx="8" fill="#2dd4bf" opacity=".16" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="1.5"/>
    <g font-family="ui-monospace, monospace" font-size="15" fill="#2dd4bf">
      <text x="330" y="280">&#8592; 60-day notice, cited</text>
    </g>
    <!-- quote bracket -->
    <path d="M24 232v56h10" fill="none" stroke="#2dd4bf" stroke-opacity=".7" stroke-width="3"/>
    <!-- unsupported answer -->
    <g font-family="ui-monospace, monospace" font-size="15">
      <rect x="24" y="380" width="380" height="34" rx="8" fill="#f59e0b" opacity=".12" stroke="#f59e0b" stroke-opacity=".5"/>
      <text x="40" y="403" fill="#fbbf24">arbitration venue &#8594; unsupported</text>
    </g>
    <rect x="24" y="440" width="340" height="34" rx="8" fill="#f87171" opacity=".12" stroke="#f87171" stroke-opacity=".5"/>
    <text x="40" y="463" font-family="ui-monospace, monospace" font-size="15" fill="#fca5a5">fabricated quote &#8594; dropped</text>
    <text x="24" y="530" font-family="ui-monospace, monospace" font-size="15" fill="#7f8aac">citationsDropped: 1</text>
  </g>

  <!-- the seal: EIP-191 + 0G -->
  <g transform="translate(840 330)">
    <circle r="234" fill="#0e7490" opacity=".2" filter="url(#soft)"/>
    <circle r="198" fill="none" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 14"/>
    <g transform="translate(0 -150)">
      <text x="-150" y="0" font-family="ui-monospace, monospace" font-size="17" letter-spacing="3" fill="#7dd3fc">SEALED</text>
    </g>
    <g transform="translate(0 10)">
      <rect x="-86" y="-86" width="172" height="172" rx="22" fill="#0f172a" stroke="url(#seal)" stroke-width="4"/>
      <g font-family="ui-monospace, monospace" text-anchor="middle">
        <text y="-40" font-size="15" fill="#94a3b8">EIP-191</text>
        <text y="-14" font-size="13" fill="#38bdf8">digest 0x215b1b00…</text>
        <text y="10" font-size="13" fill="#2dd4bf">signed &amp; chained</text>
        <text y="34" font-size="13" fill="#f0abfc">seq 6 &#8592; prev hash</text>
        <text y="58" font-size="13" fill="#94a3b8">0G ANCHORED</text>
      </g>
    </g>
    <g transform="translate(0 175)">
      <text x="-150" y="0" font-family="ui-monospace, monospace" font-size="15" fill="#7f8aac">TEE-attested · qwen3-vl-30b · deepseek-v4-flash</text>
    </g>
  </g>

  <!-- header -->
  <text x="70" y="80" font-family="ui-monospace, monospace" font-size="26" font-weight="bold" fill="#e2e8f0">EVIDIQ CLAUSE</text>
  <text x="70" y="112" font-family="ui-monospace, monospace" font-size="16" fill="#7dd3fc">DECODING DOCUMENTS · PROVING TRUTH</text>
</svg>
