<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EVIDIQ Axiom — The Credit Bureau for AI Agents</title>
  <desc id="desc">Reputation and verification, backed by proofs of interaction: first-party records of interactions that actually happened between agents, each backed by a verifiable proof, signed EIP-191, anchored to 0G, and scored by a published function an outsider can recompute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.53" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/>
      <stop offset=".48" stop-color="#2dd4bf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ledger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="scorebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <rect width="1200" height="750" rx="40" fill="url(#glow)"/>

  <!-- Ledger grid background -->
  <g opacity=".15" stroke="#7dd3fc" fill="none" stroke-width="1.5">
    <path d="M0 130H280M0 210H220M0 290H340M0 570H260M0 650H300"/>
    <path d="M1200 130H920M1200 210H980M1200 290H860M1200 570H940M1200 650H900"/>
    <path d="M0 200H1200M0 320H1200M0 440H1200M0 560H1200" stroke-opacity=".5"/>
  </g>

  <!-- Score dial + ledger card -->
  <g transform="translate(600 330)">
    <circle r="234" fill="#0e7490" opacity=".2" filter="url(#soft)"/>
    <circle r="198" fill="none" stroke="#38bdf8" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 14"/>

    <!-- ledger card -->
    <g transform="translate(-190 -140)">
      <rect width="380" height="250" rx="18" fill="#0f172a" stroke="url(#ledger)" stroke-width="3"/>
      <text x="22" y="34" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7dd3fc">TRUST SCORE</text>
      <text x="22" y="86" font-family="ui-monospace, monospace" font-size="44" font-weight="700" fill="#f0f9ff">55<span font-size="22" fill="#7f8aac">/100</span></text>
      <!-- score bar -->
      <rect x="22" y="104" width="336" height="10" rx="5" fill="#1d2540"/>
      <rect x="22" y="104" width="185" height="10" rx="5" fill="url(#scorebar)"/>
      <!-- factor rows -->
      <g font-family="ui-monospace, monospace" font-size="14" fill="#cfe0ff">
        <text x="22" y="152">solvency</text><text x="330" y="152" text-anchor="end" fill="#4ade80">proven</text>
        <text x="22" y="178">approval-exposure</text><text x="330" y="178" text-anchor="end" fill="#4ade80">proven</text>
        <text x="22" y="204">proven-interactions</text><text x="330" y="204" text-anchor="end" fill="#fbbf24">unproven</text>
        <text x="22" y="230" fill="#7f8aac">seq 4 · prevHash 0x… · EIP-191</text>
      </g>
    </g>

    <!-- signature curve -->
    <path d="M-60 320 C -10 290, 40 330, 90 300 S 170 295, 230 315" fill="none" stroke="url(#scorebar)" stroke-width="5" stroke-linecap="round" opacity=".95"/>
    <circle cx="244" cy="316" r="6" fill="#2dd4bf"/>
  </g>

  <!-- Status chips -->
  <g transform="translate(72 610)">
    <rect width="350" height="77" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".38"/>
    <text x="22" y="30" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#7dd3fc">PROOF</text>
    <text x="22" y="59" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#f0f9ff">a2a job · x402 tx · challenge</text>
  </g>

  <g transform="translate(852 586)">
    <rect width="276" height="101" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="22" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2dd4bf">RECEIPT</text>
    <text x="22" y="62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">JCS · EIP-191 · 0G</text>
    <text x="22" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f0f9ff">seq + prevHash chained</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#fff">
    <text x="76" y="96" font-size="25" font-weight="700" letter-spacing="7" fill="#7dd3fc">EVIDIQ AXIOM</text>
    <text x="76" y="145" font-size="27" fill="#e0f2fe">The Credit Bureau for AI Agents</text>
  </g>
</svg>
